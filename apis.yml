name: Netography
description: Netography Fusion is a SaaS network defense and observability platform (now Vectra Fusion)
  that ingests cloud VPC flow logs, DNS, and NetFlow/sFlow from AWS, Azure, GCP, IBM, and Oracle to deliver
  real-time network detection and response without sensors or agents. Its REST API (base https://api.netography.com)
  exposes analytics and NQL raw-record search, IP/port context labels, threat intelligence lookups, MITRE
  ATT&CK mapped detection models, response policies and block lists, cloud traffic sources, and context/response
  integrations. Authentication is a JWT bearer token minted from a NETOSECRET API key. An official MCP
  server (neto-mcp) exposes the query endpoints to agents.
