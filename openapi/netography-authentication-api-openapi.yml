  /api/auth/bearer/refresh:
    post:
      operationId: auth_bearer_refresh_post
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
      summary: via Refresh Token
      description: Obtain a new `access_token` via a `refresh_token`
      responses:
        '200':
          description: A JSON object which contains the `access_token` to use in all subsequent calls to the API
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  access_token:
                    type: string
                    description: Access Token (JWT)
                    readOnly: true
                  expires_in:
                    type: integer
                    description: Seconds until the Access Token expires
                    readOnly: true
