          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
              required:
              - username
              - password
      summary: via User Credentials
      description: Obtain an `access_token` via User Credentials
